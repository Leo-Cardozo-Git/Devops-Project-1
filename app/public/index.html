<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentes Brilhantes — Slideshow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1: #0b1020;
    --bg-2: #121a33;
    --line: #29335c;
    --text: #eef0fb;
    --text-dim: #7c85b3;
    --spark: #ffcf6b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,0.55) 0, transparent 60%),
      radial-gradient(1px 1px at 78% 18%, rgba(255,255,255,0.4) 0, transparent 60%),
      radial-gradient(1.5px 1.5px at 34% 68%, rgba(255,255,255,0.5) 0, transparent 60%),
      radial-gradient(1px 1px at 62% 82%, rgba(255,255,255,0.35) 0, transparent 60%),
      radial-gradient(1px 1px at 90% 55%, rgba(255,255,255,0.4) 0, transparent 60%),
      radial-gradient(1px 1px at 8% 85%, rgba(255,255,255,0.3) 0, transparent 60%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .frame{
    width:min(760px, 88vw);
    text-align:center;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--spark);
    margin-bottom:36px;
    opacity:0.85;
  }

  .stage{
    position:relative;
    min-height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .slide{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:translateY(10px);
    transition:opacity 0.9s ease, transform 0.9s ease;
    pointer-events:none;
  }
  .slide.active{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }

  .quote{
    font-family:'Fraunces', serif;
    font-weight:300;
    font-style:italic;
    font-size:clamp(24px, 4vw, 38px);
    line-height:1.4;
    color:var(--text);
    margin:0 0 26px;
  }
  .quote::before{ content:"“"; color:var(--spark); font-style:normal; }
  .quote::after{ content:"”"; color:var(--spark); font-style:normal; }

  .author{
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--text-dim);
  }
  .author span{ color:var(--spark); }

  .dots{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-top:48px;
  }
  .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--line);
    cursor:pointer;
    transition:background 0.3s, transform 0.3s;
    border:none;
    padding:0;
  }
  .dot.active{ background:var(--spark); transform:scale(1.4); }

  footer{
    position:fixed;
    bottom:18px;
    font-size:10.5px;
    color:var(--text-dim);
    letter-spacing:0.06em;
  }
</style>
</head>
<body>

  <div class="frame">
    <div class="eyebrow">Mentes que mudaram a ciência</div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
  </div>

  <footer>servido via docker · rodando em ec2</footer>

<script>
  const quotes = [
    { text: "A imaginação é mais importante que o conhecimento.", author: "Albert Einstein" },
    { text: "Nada na vida deve ser temido, apenas compreendido.", author: "Marie Curie" },
    { text: "Se vi mais longe, foi por estar sobre ombros de gigantes.", author: "Isaac Newton" },
    { text: "Não é o mais forte que sobrevive, mas o mais adaptável.", author: "Charles Darwin" },
    { text: "O presente é deles; o futuro, pelo qual trabalho, é meu.", author: "Nikola Tesla" },
    { text: "A inteligência é a capacidade de se adaptar à mudança.", author: "Stephen Hawking" },
    { text: "Que estranha e sonhadora criatura é a imaginação.", author: "Ada Lovelace" },
    { text: "Estudo a ciência porque quero saber como o mundo funciona.", author: "Richard Feynman" },
    { text: "A ciência e a vida cotidiana não podem ser separadas.", author: "Rosalind Franklin" },
    { text: "Em algum lugar, algo incrível espera para ser descoberto.", author: "Carl Sagan" },
    { text: "E, no entanto, ela se move.", author: "Galileu Galilei" },
    { text: "O porto mais seguro para um navio não é o mar.", author: "Grace Hopper" },
  ];

  const stage = document.getElementById("stage");
  const dotsEl = document.getElementById("dots");
  let current = 0;
  let timer = null;
  const INTERVAL = 6000;

  quotes.forEach((q, i) => {
    const slide = document.createElement("div");
    slide.className = "slide" + (i === 0 ? " active" : "");
    slide.innerHTML = `<p class="quote">${q.text}</p><p class="author">— <span>${q.author}</span></p>`;
    stage.appendChild(slide);

    const dot = document.createElement("button");
    dot.className = "dot" + (i === 0 ? " active" : "");
    dot.setAttribute("aria-label", `Ir para frase ${i + 1}`);
    dot.addEventListener("click", () => goTo(i));
    dotsEl.appendChild(dot);
  });

  const slideEls = document.querySelectorAll(".slide");
  const dotEls = document.querySelectorAll(".dot");

  function goTo(index) {
    slideEls[current].classList.remove("active");
    dotEls[current].classList.remove("active");
    current = index;
    slideEls[current].classList.add("active");
    dotEls[current].classList.add("active");
    resetTimer();
  }

  function next() {
    goTo((current + 1) % quotes.length);
  }

  function resetTimer() {
    clearInterval(timer);
    timer = setInterval(next, INTERVAL);
  }

  resetTimer();
</script>
</body>
</html>
